<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chó Gay</title>
    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <!-- =====================================================
         HOMEPAGE + LIBRARY
         ===================================================== -->

    <div id="library-page">

        <!-- =========================
             HOMEPAGE
             ========================= -->

        <header>

            <!-- Site title -->

            <h1 id="site-title">
                <span class="title-normal">cháy go</span>
                <span class="title-hover">chó gay</span>
            </h1>


            <!-- Hero decorations -->

            <img
                src="images/deco-4.png"
                class="hero-decoration"
                alt=""
            >

            <img
                src="images/deco-11.png"
                class="hero-decoration-2"
                alt=""
            >

            <img
                src="images/deco-14.png"
                class="hero-decoration-3"
                alt=""
            >

            <img
                src="images/deco-18.png"
                class="hero-decoration-4"
                alt=""
            >

            <img
                src="images/deco-19.png"
                class="hero-decoration-5"
                alt=""
            >

            <img
                src="images/deco-20.png"
                class="hero-decoration-6"
                alt=""
            >


            <!-- Homepage navigation -->

            <nav>

                <!-- Home -->

                <button
                    id="home-button"
                    type="button"
                    aria-label="Home"
                >
                    <span class="button-number">(0)</span>
                    <span class="button-label">detox</span>
                </button>


                <!-- Yaoi -->

                <button
                    id="yaoi-button"
                    type="button"
                >
                    <span class="button-number">(1)</span>
                    <span class="button-label">ボーイズラブ</span>
                </button>


                <!-- Danmei -->

                <button
                    id="danmei-button"
                    type="button"
                >
                    <span class="button-number">(2)</span>
                    <span class="button-label">耽美</span>
                </button>


                <!-- Random -->

                <button
                    id="random-button"
                    type="button"
                >
                    <span class="button-number">(3)</span>
                    <span class="button-label">gacha</span>
                </button>


                <!-- Admin -->

                <button
                    id="admin-button"
                    type="button"
                >
                    <span class="button-number">(4)</span>
                    <span class="button-label">ulti</span>
                </button>


                <!-- Search -->

                <button
                    id="search-button"
                    type="button"
                >
                    <span class="button-number">(5)</span>
                    <span class="button-label">check map</span>
                </button>

            </nav>

        </header>


        <!-- =========================
             LIBRARY PAGE
             ========================= -->

        <main id="library-main">

            <!-- Library decorations -->

            <img
                src="images/library-deco-1.png"
                class="library-decoration"
                alt=""
            >

            <img
                src="images/library-deco-2.png"
                class="library-decoration-2"
                alt=""
            >

            <img
                src="images/library-deco-3.png"
                class="library-decoration-3"
                alt=""
            >

            <img
                src="images/library-deco-4.png"
                class="library-decoration-4"
                alt=""
            >

            <img
                src="images/library-deco-5.png"
                class="library-decoration-5"
                alt=""
            >

            <img
                src="images/library-deco-6.png"
                class="library-decoration-6"
                alt=""
            >

            <img
                src="images/library-deco-7.png"
                class="library-decoration-7"
                alt=""
            >


            <!-- Library home -->

            <button
                id="library-home-button"
                type="button"
                aria-label="Home"
            >
                <span class="button-number">(0)</span>
                <span class="button-label">detox</span>
            </button>


            <!-- Sort buttons -->

            <div id="library-sort-buttons">

                <button
                    id="sort-az"
                    type="button"
                >
                    <span class="sort-number">(.1)</span>
                    <span class="sort-label">a to z</span>
                </button>


                <button
                    id="sort-za"
                    type="button"
                >
                    <span class="sort-number">(.2)</span>
                    <span class="sort-label">z to a</span>
                </button>

            </div>


            <!-- Book rows -->

            <section id="books-container">
                <!-- Books are inserted here by script.js -->
            </section>

        </main>

    </div>


    <!-- =====================================================
         RANDOM / GACHA PAGE
         ===================================================== -->

    <div id="random-page">

        <!-- Home -->

        <button
            id="random-home-button"
            type="button"
            aria-label="Home"
        >
            <span class="button-number">(0)</span>
            <span class="button-label">detox</span>
        </button>


        <!-- Random start -->

        <button
            id="random-start-button"
            type="button"
        >
            gacha
        </button>

        <!-- Random decorations -->

        <img
            src="images/random-deco-1.png"
            class="random-decoration"
            alt=""
        >

        <img
            src="images/random-deco-2.png"
            class="random-decoration-2"
            alt=""
        >

        <img
            src="images/random-deco-3.png"
            class="random-decoration-3"
            alt=""
        >

        <img
            src="images/random-deco-4.png"
            class="random-decoration-4"
            alt=""
        >

        <img
            src="images/random-deco-5.png"
            class="random-decoration-5"
            alt=""
        >
        <!-- Random result -->

        <div id="random-result">
            <!-- Random book appears here -->
        </div>

    </div>


    <!-- =====================================================
         PERSISTENT BOOK WINDOWS
         ===================================================== -->

    <div id="windows-container">
        <!-- Book windows are created by script.js -->
    </div>


    <!-- =====================================================
         RANDOM CLOSE WARNING
         ===================================================== -->

    <div id="random-close-warning">

        <div id="random-close-box">

            <div id="random-close-title">
                ok chưa cu?
            </div>


            <div id="random-close-buttons">

                <button
                    id="random-again-choice"
                    type="button"
                >
                    reroll
                </button>


                <button
                    id="random-home-choice"
                    type="button"
                >
                    dạ ok òi
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         WINDOW LIMIT WARNING
         ===================================================== -->

    <div id="limit-warning">

        <div id="limit-warning-box">

            <div id="limit-warning-title">
                ĐIÊN HẢ MÁ NỘI???
            </div>


            <div id="limit-warning-text">
                CHỌN 1 CÁI RỒI TẮT BỚT TAB DÙM TAO
            </div>


            <button
                id="limit-warning-close"
                type="button"
            >
                rồi rồi rồi
            </button>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="script.js"></script>

</body>

</html>
